<!DOCTYPE html>
<html lang="ar">
<head>
  <!--
    $FLUTTER_BASE_HREF يُستبدل تلقائياً بقيمة --base-href عند flutter build web.
    إن نُشر التطبيق في مسار فرعي (مثل /citizen/) ابنِه بـ: flutter build web --base-href /citizen/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مطرحك — مطرحك معروف، وبلاغك متابع. ارفع بلاغك بالصور والموقع وتابعه حتى الحل.">
  <meta name="theme-color" content="#0F6B4A">

  <!-- تثبيت التطبيق على الشاشة الرئيسية (PWA) — iOS و Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مطرحك">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مطرحك</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
