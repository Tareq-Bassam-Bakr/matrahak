name: matrahak_citizen
description: "مطرحك — تطبيق المواطن: رفع البلاغات ومتابعتها على الخريطة."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة والتنقل
  flutter_riverpod: ^3.3.0
  go_router: ^17.0.0

  # الشبكة والتخزين
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # الخرائط والموقع (OpenStreetMap — بدون Google)
  flutter_map: ^8.2.1
  latlong2: ">=0.9.1 <0.11.0"
  geolocator: ^14.0.2

  # الوسائط والروابط
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
